<!DOCTYPE html>

<html lang="en-US">
 <head>
  <meta charset="UTF-8">
  <title>Notes</title>
  <script src="notes.js" async></script>
  <link rel="icon" type="image/svg" href="icon.svg">
  <link rel="stylesheet" href="notes.css">
 </head>
 <body>
  <h1>Notes</h1>
  <div id='notes'>
  </div>
  <br>
  <div class='newnote'>
   <h2 id='legend'>New Note</h2>
    <div id='form'>
     <label for='newname'>Note Name:</label>
     <input type='text' id='newname' name='newname'></input>
     <label for='newcontent'>Content:</label>
     <textarea name='newcontent' id='newcontent'></textarea>
     <br>
     <input type='submit' id='submit' class='button' value="Add Note" onclick="newNote()">
    </div>
  </div>
  <a href='https://github.com/rainier39/NotesApp'>NotesApp</a> created by rainier39.
 </body>
</html>
